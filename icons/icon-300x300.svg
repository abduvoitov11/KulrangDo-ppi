<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>

    <!-- Doppi Silk Charcoal Gradient -->
    <linearGradient id="doppiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Silver Silk Embroidery Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Container -->
  <circle cx="150" cy="150" r="142" fill="url(#bgGrad)" stroke="#4b5563" stroke-width="3"/>
  <circle cx="150" cy="150" r="136" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ===== ASOSIY O'ZBEK CHUST DO'PPISI ===== -->
  <g id="uzbekDoppi">
    <!-- Doppi 4-faceted Body (Silhouette) -->
    <path d="M 150,44 
             C 180,52 226,72 242,92
             C 250,122 254,154 256,182
             C 216,198 180,204 150,204
             C 120,204 84,198 44,182
             C 46,154 50,122 58,92
             C 74,72 120,52 150,44 Z" 
          fill="url(#doppiGrad)" 
          stroke="#f8fafc" 
          stroke-width="3"/>

    <!-- Left facet shadow for 3D depth -->
    <path d="M 150,44 
             C 120,52 74,72 58,92
             C 50,122 46,154 44,182
             C 84,198 120,204 150,204 Z" 
          fill="#000000" 
          fill-opacity="0.22"/>

    <!-- Seam Lines (Do'ppi choklari) -->
    <!-- Markaziy qirra choki -->
    <line x1="150" y1="44" x2="150" y2="204" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Chap diagonal chok -->
    <path d="M 58,92 C 90,112 124,126 150,132" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- O'ng diagonal chok -->
    <path d="M 242,92 C 210,112 176,126 150,132" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ===== CHUST BODOM NAQSHI (LEFT ALMOND) ===== -->
    <!-- Bodom qobig'i (oq ipak kashta) -->
    <path d="M 104,116 
             C 86,116 70,130 72,150 
             C 74,168 92,178 112,176 
             C 124,174 130,166 128,156
             C 126,146 114,144 110,150
             C 106,156 112,162 114,162
             C 104,164 86,158 84,146
             C 82,134 92,124 104,124
             C 116,124 126,132 130,142" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <!-- Bodom ichidagi oq ipak gullar / nuqtalar -->
    <circle cx="100" cy="140" r="3.5" fill="#ffffff"/>
    <circle cx="92" cy="152" r="2.5" fill="#f8fafc"/>
    <circle cx="100" cy="162" r="2.5" fill="#f8fafc"/>
    <circle cx="112" cy="134" r="2" fill="#e2e8f0"/>

    <!-- ===== CHUST BODOM NAQSHI (RIGHT ALMOND) ===== -->
    <!-- Bodom qobig'i (oq ipak kashta) -->
    <path d="M 196,116 
             C 214,116 230,130 228,150 
             C 226,168 208,178 188,176 
             C 176,174 170,166 172,156
             C 174,146 186,144 190,150
             C 194,156 188,162 186,162
             C 196,164 214,158 216,146
             C 218,134 208,124 196,124
             C 184,124 174,132 170,142" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <!-- Bodom ichidagi oq ipak gullar / nuqtalar -->
    <circle cx="200" cy="140" r="3.5" fill="#ffffff"/>
    <circle cx="208" cy="152" r="2.5" fill="#f8fafc"/>
    <circle cx="200" cy="162" r="2.5" fill="#f8fafc"/>
    <circle cx="188" cy="134" r="2" fill="#e2e8f0"/>

    <!-- ===== ETAGI (JIYAK / KIZAK) ===== -->
    <!-- Jiyak hoshiyasi -->
    <path d="M 44,182 C 84,198 120,204 150,204 C 180,204 216,198 256,182" 
          fill="none" 
          stroke="#f8fafc" 
          stroke-width="4"/>
    <path d="M 45,190 C 84,206 120,212 150,212 C 180,212 216,206 255,190" 
          fill="none" 
          stroke="#64748b" 
          stroke-width="1.5"/>

    <!-- Mavj (To'lqinsimon chok / zig-zag naqsh) -->
    <path d="M 58,187 L 66,193 L 74,188 L 82,194 L 90,190 L 98,196 L 106,192 L 114,198 L 122,194 L 130,200 L 138,196 L 146,202 L 154,202 L 162,196 L 170,200 L 178,194 L 186,198 L 194,192 L 202,196 L 210,190 L 218,194 L 226,188 L 234,193 L 242,187" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- ===== YUKLAB OLISH BELGISI (DOWNLOAD ARROW) ===== -->
  <g id="downloadIcon" transform="translate(150, 248)">
    <!-- Ko'k/Kumush rangli yuklab olish strelkasi -->
    <path d="M 0,-18 L 0,8 M -9,-1 L 0,8 L 9,-1" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Ostki patnis chizig'i -->
    <path d="M -18,6 L -18,14 L 18,14 L 18,6" 
          fill="none" 
          stroke="#f8fafc" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>